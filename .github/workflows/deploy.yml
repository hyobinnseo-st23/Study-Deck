name: Deploy to GitHub Pages

# main 에 push 하면 사이트를 빌드해 GitHub Pages 로 배포합니다.
#  - manifest.json 을 최신 상태로 생성
#  - Secret(SITE_PASSWORD)의 SHA-256 해시를 lock.js 에 주입
#  - 결과물을 Pages 로 배포
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 하나의 배포만 진행
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          python3 - <<'PY'
          import os, json, re
          d = "quizzes"
          files = sorted(
              (f for f in os.listdir(d) if f.endswith(".json") and f != "manifest.json"),
              key=lambda n: "".join(p.zfill(10) if p.isdigit() else p
                                    for p in re.split(r"(\d+)", n)),
          )
          valid = []
          for f in files:
              try:
                  with open(os.path.join(d, f), encoding="utf-8") as fp:
                      json.load(fp)
                  valid.append(f)
              except Exception as e:
                  print(f"skip {f}: {e}")
          manifest = {
              "_comment": "이 파일은 GitHub Actions 가 quizzes/ 폴더를 스캔해 자동 생성합니다.",
              "quizzes": valid,
          }
          with open(os.path.join(d, "manifest.json"), "w", encoding="utf-8") as fp:
              json.dump(manifest, fp, ensure_ascii=False, indent=2)
              fp.write("\n")
          print("quizzes:", valid)
          PY

      - name: Inject password hash
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "$SITE_PASSWORD" ]; then
            echo "::error::SITE_PASSWORD secret 이 설정되어 있지 않습니다. Settings > Secrets and variables > Actions 에서 추가하세요."
            exit 1
          fi
          HASH=$(printf '%s' "$SITE_PASSWORD" | sha256sum | cut -d' ' -f1)
          sed -i "s/__PASSWORD_HASH__/$HASH/" lock.js
          echo "해시 주입 완료 (앞 8자리: ${HASH:0:8}...)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
