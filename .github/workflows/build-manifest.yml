name: Build quiz manifest

# quizzes/ 폴더의 .json 파일을 push 하면 manifest.json 을 자동으로 다시 생성해 커밋합니다.
# 즉, 새 문제집 파일만 올리면 manifest 를 손으로 고칠 필요가 없습니다.
on:
  push:
    branches: [main]
    paths:
      - 'quizzes/**.json'
      - '!quizzes/manifest.json'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          python3 - <<'PY'
          import os, json
          d = "quizzes"
          files = sorted(
              (f for f in os.listdir(d) if f.endswith(".json") and f != "manifest.json"),
              key=lambda n: "".join(p.zfill(10) if p.isdigit() else p
                                    for p in __import__("re").split(r"(\d+)", n)),
          )
          # 잘못된 JSON 은 목록에서 제외
          valid = []
          for f in files:
              try:
                  with open(os.path.join(d, f), encoding="utf-8") as fp:
                      json.load(fp)
                  valid.append(f)
              except Exception as e:
                  print(f"skip {f}: {e}")
          manifest = {
              "_comment": "이 파일은 GitHub Actions(build-manifest.yml)가 quizzes/ 폴더를 스캔해 자동 생성합니다. 직접 수정하지 마세요.",
              "quizzes": valid,
          }
          with open(os.path.join(d, "manifest.json"), "w", encoding="utf-8") as fp:
              json.dump(manifest, fp, ensure_ascii=False, indent=2)
              fp.write("\n")
          print("quizzes:", valid)
          PY

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain quizzes/manifest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add quizzes/manifest.json
            git commit -m "chore: manifest 자동 갱신 [skip ci]"
            git push
          else
            echo "manifest 변경 없음"
          fi
